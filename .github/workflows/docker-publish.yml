name: Docker

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'CODEOWNERS'
      - '.github/dependabot.yml'

  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'CODEOWNERS'
      - '.github/dependabot.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  docker:
    permissions:
      contents: read
      packages: write  # push to GHCR with GITHUB_TOKEN
      id-token: write  # sign the provenance attestations
      attestations: write  # store the attestations
    uses: chorrell/workflows/.github/workflows/docker-publish.yml@feature/docker-publish
    with:
      image-name: pwgen
      test-command: docker run -i --rm "$IMAGE" -sycnB -1 25
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
